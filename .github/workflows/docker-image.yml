# ============================================================================
# 构建并发布 DSH 基础镜像到 GitHub Container Registry (ghcr.io)
#
# 触发：
#   - 推送 v* tag -> 镜像 tag 为该 tag + latest
#     tag 格式：v<项目版本>-dsh-<dsh版本>，如 v0.5.1-dsh-0.1.7-alpha.1
#     解析与校验在 scripts/ci-image-tags.sh（有单测 scripts/t/test-ci-image-tags.sh）
#   - 推送 main 分支 -> 镜像 tag 为 main，seed 装 npm latest
#   - 手动 dispatch   -> main 分支打 :main，其他分支打 :branch-<slug>（不污染 :main）
#
# 发布门禁（三道）：
#   1) unit-tests job 跑 scripts/t/test-*.sh，不通过则 build 根本不执行
#   2) tag 严格校验：dsh 版本必须以数字开头，否则拒绝发布（防"假锁版"镜像）
#   3) 镜像自证：tag 构建后用镜像内 seed 的 dsh --version 断言 == tag 后缀
#
# 说明：镜像含运行环境 + dsh/pnpm seed（/opt/dsh-seed），首次启动由 entrypoint
# 复制到挂载卷 /opt/dsh；日常升级走 docker exec npm install（见 scripts/entrypoint.sh）。
# ============================================================================

name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 纯文档改动不重建镜像。这同时是末尾「同步 DSH 版本徽章」步骤回推 main 的防回环措施：
    # 该步骤发版后会提交 README，没有这条过滤就会额外触发一次 main 镜像构建，还会与正在跑的
    # tag 构建在同一个 image-publish 组里排队。
    # 注：路径过滤对 tag 推送本就不生效（GitHub 规则），因此 tag 构建完全不受影响。
    paths-ignore:
      - '**.md'
    # 注意：GitHub 的路径过滤按【变更文件列表】判定 —— 空提交（--allow-empty）没有任何变更文件，
    # 因此**不会触发**本工作流。想重建一次 main 镜像必须带真实文件改动。
  workflow_dispatch:

# 发布串行化：:latest 是所有 tag 构建共享的输出。若按 github.ref 分组，v0.4.1 与 v0.4.2 的构建
# 分属不同组、互不排队，先触发但后完成的旧构建会把 :latest 回退到旧版本。故必须全局单组。
# cancel-in-progress: false = 排队而非取消，避免打断正在推送的镜像。
concurrency:
  group: image-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # 镜像名取仓库全名（含所有者，ghcr 要求小写，由 ci-image-tags.sh 统一转小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- 门禁 1：单测（~11s）----
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run rescue unit tests
        run: |
          fail=0
          for f in scripts/t/test-*.sh; do
            printf '%-42s' "$(basename "$f")"
            if sh "$f" >/tmp/unit-test.out 2>&1; then
              echo PASS
            else
              echo FAIL
              cat /tmp/unit-test.out
              # job log 需要认证才能下载，而 annotations 对公开仓库可匿名读取 —— 把失败脚本名
              # 与尾部输出做成 annotation，红灯原因不必登录即可定位。
              echo "::error title=unit-test FAILED: $(basename "$f")::$(tail -6 /tmp/unit-test.out | tr '\n' '~' | cut -c1-500)"
              fail=1
            fi
          done
          exit "$fail"

  build-and-push:
    needs: unit-tests
    runs-on: ubuntu-latest
    # 纵深防御：任何步骤若意外"永不返回"（例如误把长驻进程当一次性命令执行）都不会挂满 6 小时
    timeout-minutes: 30
    permissions:
      contents: write   # 创建 GitHub Release
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构构建需要）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # 表达式一律经 env 传入：直接插进 run 脚本是 GitHub 官方列出的脚本注入向量。
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: sh scripts/ci-image-tags.sh >> "$GITHUB_OUTPUT"

      # ---- 诊断：build 开始时戳个时间戳，供末尾的 summary 步骤算总耗时 ----
      - name: Mark build start
        run: date -u +%s > /tmp/build_start_epoch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DSH_VERSION=${{ steps.meta.outputs.dsh_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.proj_version }}
            org.opencontainers.image.dsh-version=${{ steps.meta.outputs.dsh_version }}
          # 缓存策略：tag 构建启用 gha 缓存；分支构建当前 no-cache（保守选择）。
          # 历史理由已作废：分支构建的 DSH_VERSION 曾恒为字符串 "latest"，复用缓存会让
          # `npm install -g @deepseek-ai/dsh@latest` 那层命中旧缓存、不再跟随 npm 最新版。
          # 自 2026-09-22 起分支构建也改用 Dockerfile 的 ARG DSH_VERSION（原因见
          # scripts/ci-image-tags.sh：npm 上 latest=0.1.5-rc.2 的依赖图引用了未发布的子包版本，
          # 直接 ETARGET 失败），内容可复现，故复用缓存本已安全 —— no-cache 仅保留为保守选择。
          #
          # 【跨 tag 缓存复用】gha 缓存默认 scope 是当前 ref（每个 tag 各自隔离），于是 v0.4.x 与
          # v0.4.(x+1) 之间底层（apt 装包、node 基础、rescue 工具、entrypoint）无法复用，
          # 每次发版都从零重建这些与 DSH_VERSION 无关的层。这里给 cache-from/cache-to 统一固定一个
          # scope=base 的命名空间：所有 tag 构建读写同一份 GHA 缓存。Docker/Buildkit 的缓存 key 是
          # 各层内容哈希，内部自组织 —— 不同 DSH_VERSION 的 npm 层会以不同 key 共存，**不存在
          # 互相覆盖污染**。只有 DSH_VERSION=latest 的分支构建不上缓存（已在 no-cache 排除）。
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          no-cache: ${{ github.ref_type != 'tag' }}

      # ---- 发布：tag 构建成功后自动创建 GitHub Release（notes 取自 CHANGELOG 对应段落）----
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 从 CHANGELOG 抽出本 tag 的段落作为 release notes；抽不到就退回 CHANGELOG 链接
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf 'See CHANGELOG.md for details.\n' > /tmp/notes.md
          fi
          # 幂等：已存在则更新，不存在则创建（手动重跑 workflow 也不会报错）。
          # --draft=false 是必需的：tag 删除后重推会让 GitHub 把原 Release 转为 **draft**，
          # 而 gh release edit 默认不改 draft 状态 —— 那样 job 绿灯、用户却在 Releases
          # 页面看不到（匿名 /releases/tags/<tag> 返回 404）。见 create-release.yml 同处注释。
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md --draft=false \
            || gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md

      # ---- 门禁 3：镜像自证（防"标着锁版、实为 latest"）----
      - name: Verify image carries the locked DSH version
        if: github.ref_type == 'tag'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECT: ${{ steps.meta.outputs.dsh_version }}
        run: |
          IMG="${TAGS%%,*}"
          # 必须显式 --entrypoint：本镜像的 ENTRYPOINT 是 dsh-entrypoint，镜像名之后的命令只会作为
          # CMD 追加给它，而 scripts/entrypoint.sh 不消费 "$@" —— 那样会照常走 seed/socat 并真的启动 dsh web：
          # 起得来就永不返回，起不来也要等满自愈窗口，两种都会让门禁误红甚至挂死。
          got="$(docker run --rm --platform linux/amd64 --entrypoint /opt/dsh-seed/bin/dsh \
                  "$IMG" --version 2>/tmp/smoke.err | tr -d '[:space:]')"
          echo "image=$IMG expected=$EXPECT got=$got"
          if [ "$got" != "$EXPECT" ]; then
            echo "::error::镜像内 seed 的 dsh 版本($got) 与 tag 后缀($EXPECT) 不一致：这就是假锁版镜像"
            echo '--- smoke stderr ---'; cat /tmp/smoke.err 2>/dev/null || true
            exit 1
          fi

      # ---- 发布收尾：把 README 里的 DSH 版本徽章同步到本次发布的版本 ----
      # README 中该徽章是 shields **静态**徽章，没有上游数据源可查，不主动改写就会永远停在
      # 写下它的那一刻（对照：control-center 的 README 至今写着 0.1.5-alpha.1）。
      # 放在最后一步：与前面的镜像自证互不干扰，失败时镜像与 Release 也都已正常发布。
      # 该步骤失败会让 job 变红 —— 这是刻意的：徽章静默不更新比发布报错更难被发现。
      # （main 若启用了分支保护禁止直推，此处会失败，届时改为开 PR 的方式同步。）
      - name: Sync DSH version badge in READMEs
        if: github.ref_type == 'tag'
        env:
          # 表达式一律经 env 传入，遵循本文件既有约定（直接插进 run 是 GitHub 官方列出的注入向量）
          DSH_VERSION: ${{ steps.meta.outputs.dsh_version }}
        run: |
          # tag 构建 checkout 的是 tag 本身（detached HEAD 且为浅克隆），而要改的 README 在 main 上，
          # 所以先取回 main 再切过去。-B 明确以刚取到的 commit 为准，避免本地分支状态歧义。
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          # 幂等且只升不降：已是该版本则不改（下面 diff 为空直接返回），
          # 目标低于现值则拒绝并退出 1（防止补发历史 tag 时把徽章改回旧版本）。
          sh scripts/update-dsh-badge.sh "$DSH_VERSION"

          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "徽章已是最新，无需提交"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          # [skip ci] 与上面的 paths-ignore 是双保险：确保这次纯文档提交不会触发任何 CI
          git commit -m "docs: 同步 DSH 版本徽章至 ${DSH_VERSION} [skip ci]"
          git push origin main

      # ---- 诊断：记录 build & push 墙钟耗时，便于对比发版快慢 ----
      # build-push-action 是一个单 step，内部哪一段慢要看原生日志；这里在 status 处把
      # 「整个 build & push」的总耗时写进 Job Summary，作为下次优化的基线。
      - name: Publish build timing summary
        if: always()
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # 无 start 标记（例如分支保护下 build 前的标记步骤被跳过）时不报错，仅提示
          START="$(cat /tmp/build_start_epoch 2>/dev/null || echo 0)"
          END="$(date -u +%s)"
          if [ "$START" -gt 0 ] && [ "$END" -gt "$START" ]; then
            ELAPSED=$(( END - START ))
            echo "## Build & push 耗时: ${ELAPSED}s" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Build 耗时: 未能测量（start 标记缺失）" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "- ref: \`$REF\` (\`$REF_TYPE\`)"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> 该数字覆盖 build & push 步骤的墙钟耗时，用于不同发版间的相对快慢对比。"
            echo "> 更细的原生 stage 请展开对应 step 日志查看，或直接看 GitHub 自带的 step timing。"
          } >> "$GITHUB_STEP_SUMMARY"
