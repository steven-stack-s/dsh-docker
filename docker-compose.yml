# ============================================================================
# DeepSeek Harness (DSH) — 通用 Docker 部署（适用于任意 Linux/Docker 环境）
#
# 【架构】
#   - 镜像 dsh-docker（node:24 + git + socat + entrypoint）：构建一次，之后不再重建
#   - DSH 程序本体装在卷 /opt/dsh：日常升级 = 容器内 npm 操作
#   - dsh web 只监听 127.0.0.1:3081（安全设计），socat 把外部 0.0.0.0:3080 转发进去
#   - 默认内网直连；远程访问（账号密码 + MFA）按 docs/02-认证与远程访问.md 可选加装
#
# 【日常维护】
#   升级 DSH：docker exec dsh npm install -g @deepseek-ai/dsh@<新版本> && docker restart dsh
#   装插件：docker exec dsh dsh plugin --profile web add <包名> && docker restart dsh
#   换密钥：改 .env 的 DEEPSEEK_API_KEY 后 docker compose up -d
#
# 【快速开始】
#   1. cp .env.example .env 并填写 DEEPSEEK_API_KEY
#   2. docker compose up -d
#   3. 访问 http://<主机IP>:3080
# ============================================================================

services:
  dsh:
    # 镜像拉取策略：默认 ghcr.io 的 :latest（跟随最近一次 v*-dsh* tag 发布的锁定版本）。
    #   要彻底锁死某个版本，请显式指定 DSH_IMAGE=ghcr.io/steven-stack-s/dsh-docker:v<项目版本>-dsh<dsh版本>
    #   例如 v0.3.6-dsh0.1.5-rc.1（v* tag 构建时 seed 的 dsh 版本与 tag 后缀严格一致）。
    image: ${DSH_IMAGE:-ghcr.io/steven-stack-s/dsh-docker:latest}
    # 本地 build：docker compose up -d --build（产物按上方 image: 名 tag；构建时锁定 dsh 版本）
    #   DSH_VERSION 默认 0.1.5-rc.1，可在 .env 设 DSH_VERSION=<版本> 或用 --build-arg 覆盖；
    #   注意：pull 的 :latest 与本 build 的 DSH_VERSION 是两个来源，别混用（要么纯 pull 锁 DSH_IMAGE，要么纯 build）。
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.5-rc.1}
        PNPM_VERSION: ${PNPM_VERSION:-latest}
    container_name: ${DSH_CONTAINER_NAME:-dsh}
    restart: unless-stopped

    environment:
      # 数据根目录（显式指定，不依赖容器内 HOME）
      - DSH_HOME=/data/dsh
      # Node 堆上限（按宿主机内存调整；须 << MEM_LIMIT，DSH 多进程 RSS 超堆值，堆过大易被容器 OOM-kill）
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_OLD_SPACE:-1024}
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
      # 国内 npm 加速（可选）：首次安装/升级 DSH、装 pnpm 时走国内镜像源
      - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
      # ★ 模型 API 密钥（DSH 从环境变量读取，不落盘；换 key 改 .env 重建即可）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
      # ★ /api Host 信任白名单（dsh 0.1.2 起仅信任 loopback 或白名单 Host）：
      #   局域网 IP 或隧道域名访问时必须填入，否则页面能开但连接异常（/api 403）。
      #   逗号分隔，可带端口，如 "192.168.1.5:3080,app.xx.ugdocker.link"
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      # 救生舱（lifeboat）开关：RESCUE=1 时 entrypoint 进救生舱（回退到固定 dsh 版本）
      - RESCUE=${RESCUE:-0}
      # 自动干预总闸：off = 只诊断不自动改动插件树（与 RESCUE_SELFHEAL 取与）
      - RESCUE_AUTO=${RESCUE_AUTO:-on}
      - RESCUE_START_TIMEOUT=${RESCUE_START_TIMEOUT:-120}
      - RESCUE_KEEP=${RESCUE_KEEP:-3}
      # 启动重试上限（默认 KEEP+1，可独立配置）与证据目录保留份数（默认跟随 KEEP）
      - RESCUE_MAX_ATTEMPTS=${RESCUE_MAX_ATTEMPTS:-4}
      - RESCUE_EVIDENCE_KEEP=${RESCUE_EVIDENCE_KEEP:-3}
      - RESCUE_PROFILE=${RESCUE_PROFILE:-web}
      # 自动排查·根因归因·智能自愈（红线：仅动插件树四件套，绝不动 cordis.patch.yml/会话/记忆/配置/凭据）
      - RESCUE_SELFHEAL=${RESCUE_SELFHEAL:-on}
      - RESCUE_REMOVE_LIMIT=${RESCUE_REMOVE_LIMIT:-2}
      - RESCUE_ROLLBACK_LIMIT=${RESCUE_ROLLBACK_LIMIT:-2}
      - RESCUE_DIAGNOSE_EVIDENCE=${RESCUE_DIAGNOSE_EVIDENCE:-on}
      - RESCUE_EVIDENCE_MAX=${RESCUE_EVIDENCE_MAX:-20971520}
      - RESCUE_INCIDENT_KEEP=${RESCUE_INCIDENT_KEEP:-20}
      # 健康后自动拍基线快照（off=关）；此前未透传，compose 部署下无法关闭
      - RESCUE_SNAPSHOT_ON_HEALTHY=${RESCUE_SNAPSHOT_ON_HEALTHY:-on}
      # 快照模式：hardlink=cp -al（省空间，但与 live 共享 inode）；copy=cp -a（独立不可变副本）
      - RESCUE_SNAPSHOT_MODE=${RESCUE_SNAPSHOT_MODE:-hardlink}
      # 自愈预算的滑动窗口（秒）：窗口过期自动清零，避免预算永久耗尽后自愈静默失效
      - RESCUE_SELFHEAL_WINDOW=${RESCUE_SELFHEAL_WINDOW:-86400}
      # 自愈彻底失败后自动进救生舱（off=只退出，交给 restart 策略）
      - RESCUE_AUTO_LIFEBOAT=${RESCUE_AUTO_LIFEBOAT:-on}
      # socat 并发上限：fork 模式每连接一个进程，无上限时外部并发连接可耗尽容器内存
      - SOCAT_MAX_CHILDREN=${SOCAT_MAX_CHILDREN:-64}
      # 凭据文件（docker secret / 挂载文件）：优先于 DEEPSEEK_API_KEY 环境变量
      - DEEPSEEK_API_KEY_FILE=${DEEPSEEK_API_KEY_FILE:-}

    volumes:
      # DSH 程序本体（npm 全局包 + dsh/pnpm 命令）——升级与插件管理写入这里
      - ${PROGRAMS_DIR:-./programs}:/opt/dsh
      # DSH 用户数据（会话/配置/插件/凭据/Hindsight 记忆库）——必须持久化
      - ${DSH_DATA_DIR:-./dsh}:/data/dsh
      # agent 工作区
      - ${WORKSPACE_DIR:-./workspace}:/workspace

    ports:
      # 外部访问 3080；容器内 socat 转发到 dsh 内部 127.0.0.1:3081
      - "${DSH_PORT:-3080}:3080"

    # 资源限制（按宿主机配置调整；N100 + 8GB 示例给系统留余量）
    mem_limit: ${MEM_LIMIT:-2g}
    cpus: ${CPU_LIMIT:-2}
    # 进程数上限：socat 每连接 fork 一个进程，无上限时并发连接可拖垮容器
    pids_limit: ${PIDS_LIMIT:-512}

    # 容器硬化：禁止进程通过 setuid/setgid 提权（LAN 内任何能访问 3080 的人都能借 agent
    # 以 root 执行，这是低成本的第一道保险）。需要更严格时再按需加：
    #   cap_drop: [ALL]        # 部分 NAS/内核组合下可能影响卷权限，请先在测试环境验证
    #   read_only: true        # 需同时挂 tmpfs 到 /tmp
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # 与 rescue 同判据（都连 127.0.0.1:3081）；此 healthcheck 覆盖 Dockerfile 内的值。
      # start_period 是 docker 的放弃时限（容首启复制 seed + 冷启动）；
      # rescue 探测窗口 RESCUE_START_TIMEOUT(默认 120s) 必须小于它，否则 rescue 会先于 docker
      # 放弃而误回滚仍在冷启动的 dsh。调大 RESCUE_START_TIMEOUT 时请同步调大此 start_period。
      test: ["CMD", "node", "-e", "require('net').connect(3081,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 300s   # 容首启复制 seed + dsh 冷启动（须 > RESCUE_START_TIMEOUT）
      retries: 5
